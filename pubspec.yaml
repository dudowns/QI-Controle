name: deepseek
description: QI Controle de Gastos - Gerenciador Financeiro Pessoal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  image_picker: ^1.2.1
  
  # 🔥 SQLITE
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  
  # UI
  animate_do: ^5.1.0
  fl_chart: ^0.66.0
  provider: ^6.1.5+1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  
  # Supabase & Auth
  supabase_flutter: ^2.12.2
  google_sign_in: ^6.3.0
  
  # Utilitários
  share_plus: ^13.1.0
  http: ^1.3.0
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  uuid: ^4.5.2
  flutter_dotenv: ^5.2.1
  
  # ✅ File picker - VERSÃO BETA CORRETA!
  file_picker: ^12.0.0-beta.7
  
  # Notificações
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  
  # PDF
  pdf: ^3.11.3
  printing: ^5.14.3
  
  # Outros
  package_info_plus: ^10.1.0
  collection: ^1.18.0
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Splash Screen & Icons (DEV apenas)
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
    - .env
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    icon_size: 48
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7B2CBF"

flutter_native_splash:
  color: "#7B2CBF"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  web: false